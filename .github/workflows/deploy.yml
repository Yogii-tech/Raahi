name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: 'google-github-actions/auth@v3'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v3'

    - name: Authorize Docker
      run: gcloud auth configure-docker asia-south2-docker.pkg.dev

    - name: Build and Push Container
      run: |-
        docker build -t asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/raahi/backend:${{ github.sha }} .
        docker push asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/raahi/backend:${{ github.sha }}

    - name: Create Env File & Deploy to Cloud Run
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
        MSG91_TEMPLATE_ID: ${{ secrets.MSG91_TEMPLATE_ID }}
        ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        APP_ENV: production
        GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      run: |-
        python3 -c '
        import json, os
        env_keys = ["MONGO_URI", "JWT_SECRET", "MSG91_AUTH_KEY", "MSG91_TEMPLATE_ID", "ADMIN_SECRET_KEY", "SENTRY_DSN", "APP_ENV", "GCS_BUCKET_NAME"]
        env_vars = {k: os.environ[k] for k in env_keys if k in os.environ}
        with open("env.json", "w") as f:
            json.dump(env_vars, f)
        '
        gcloud run deploy raahi-api \
          --image asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/raahi/backend:${{ github.sha }} \
          --region asia-south2 \
          --platform managed \
          --allow-unauthenticated \
          --env-vars-file env.json

